[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "aiperf-hcu"
version = "0.1.0a2"
description = "海光推理服务的独立 AIPerf 适配与旁路遥测"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = ["aiperf==0.13.0", "PyYAML==6.0.3", "prometheus-client==0.23.1", "psutil==7.0.0"]

[project.scripts]
aiperf-hcu = "aiperf_hcu.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "build==1.3.0"]

[tool.uv.sources]
aiperf = {git = "https://github.com/ai-dynamo/aiperf", rev = "794f8bb75f8582f22e412d7e650fc71ca2a3d21a"}

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["upstream: actual pinned AIPerf against local mock server"]

[tool.hatch.build.targets.wheel]
packages = ["src/aiperf_hcu"]
